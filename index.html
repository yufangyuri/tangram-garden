  moon: { zh: '月夜湖亭', col: '#6E8CFF', tint: '#7E94DA', sat: .5, k: .6, lift: '#0E1A3A', la: .12 },
  begonia: { zh: '春日桃花', col: '#FF9EB8', tint: '#FFD2DC', sat: .8, k: 1.08, lift: '#F4C8D2', la: .14 },
  fan: { zh: '青绿山水', col: '#3FD6BE', tint: '#9AE0CC', sat: 1.0, k: 1.0, lift: '#1E6A64', la: .08 },
  square: { zh: '竹林晨雾', col: '#8EE07A', tint: '#CAEABA', sat: .75, k: 1.05, lift: '#DCEAD6', la: .1 } };
const SHAPES = { L: [[-.5, -.1667], [.5, -.1667], [0, .3333]], Q: [[0, .25], [.25, 0], [0, -.25], [-.25, 0]], P: [[-.375, -.125], [.125, -.125], [.375, .125], [-.125, .125]] };
SHAPES.M = SHAPES.L.map(p => [p[0] * .7071, p[1] * .7071]); SHAPES.S = SHAPES.L.map(p => [p[0] * .5, p[1] * .5]);
const PIECES = [{ id: 'L1', shape: 'L', zh: '大三角', mood: 'arch' }, { id: 'L2', shape: 'L', zh: '大三角', mood: 'octagon' }, { id: 'M', shape: 'M', zh: '中三角', mood: 'moon' },
  { id: 'S1', shape: 'S', zh: '小三角', mood: 'begonia' }, { id: 'S2', shape: 'S', zh: '小三角', mood: 'fan' }, { id: 'Q', shape: 'Q', zh: '正方', mood: 'square' }, { id: 'P', shape: 'P', zh: '平行四边', mood: null }];
const ZONE = { far: { zh: '远景 · 天空', col: '#BFD8FF' }, mid: { zh: '中景', col: '#F0DCA0' }, near: { zh: '近景', col: '#A8E6B4' } };
const PS = .085;                       // piece size in world metres
const HOME = [[-.86, .40], [-.86, .20], [-.86, .00], [.86, .52], [.86, .32], [.86, .12], [.86, -.08]];
const tg = { pieces: [], drag: null, guide: null, stuck: { far: null, mid: null, near: null }, anims: [] };

// ---------- pieces
PIECES.forEach((d, i) => { const col = d.mood ? MOOD[d.mood].col : '#F2E6C8', pts = SHAPES[d.shape];
  const shp = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1]))); const geo = new THREE.ExtrudeGeometry(shp, { depth: .06, bevelEnabled: true, bevelSize: .015, bevelThickness: .015, bevelSegments: 1 }); geo.translate(0, 0, -.03);
  const g = new THREE.Group();
  const body = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: C(col), transparent: true, opacity: .5, depthWrite: false, side: THREE.DoubleSide })); body.userData.piece = i; g.add(body);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: C(col).lerp(C('#ffffff'), .55), transparent: true, opacity: .95 })));
  const halo = glowSprite(col, 1.1, .32); g.add(halo);
  g.scale.setScalar(PS); g.visible = false; fxScene.add(g);
  tg.pieces.push({ d, i, g, body, halo, pos: new THREE.Vector3(), home: new THREE.Vector3(), zone: null, a: 0, spin: Math.random() * 6 }); });

// ---------- frame geometry helpers (local window coordinates)
function openPoly() { return cur.userData.d.opening.map(p => [p[0] * MM, p[1] * MM]); }
function openCenter(poly) { const b = bboxOf(poly); return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2]; }
// distance from the opening centre to the frame's own boundary along angle a — the frame shape IS the trigger outline
function rimAt(poly, c, a) { const dx = Math.cos(a), dy = Math.sin(a); let best = 0;
  for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; const ex = q[0] - p[0], ey = q[1] - p[1], den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) continue;
    const t = ((p[0] - c[0]) * ey - (p[1] - c[1]) * ex) / den, u = ((p[0] - c[0]) * dy - (p[1] - c[1]) * dx) / den; if (t > 0 && u >= 0 && u <= 1) best = Math.max(best, t); }
  return best || 1; }
function zoneOf(a) { const d = ((a * 180 / Math.PI) + 360) % 360; if (d > 40 && d < 140) return 'far'; if (d > 220 && d < 320) return 'near'; return 'mid'; }
const FRONT = () => .04 / cur.userData.fit;
function localToWorld(x, y, z) { return cur.localToWorld(new THREE.Vector3(x, y, z)); }
function winPlaneZ() { const c = cur.userData.center; return localToWorld(c[0], c[1], FRONT()).z; }
// where a world point sits relative to the frame boundary
function frameHit(wp) { const poly = openPoly(), c = openCenter(poly), lp = cur.worldToLocal(wp.clone()); const dx = lp.x - c[0], dy = lp.y - c[1], a = Math.atan2(dy, dx), r = Math.hypot(dx, dy), R = rimAt(poly, c, a);
  const sz = cur.userData.size, band = Math.max(sz[0], sz[1]) * .16; return { a, ok: Math.abs(r - R * 1.04) < band, zone: zoneOf(a) }; }
function rimPoint(a, k) { const poly = openPoly(), c = openCenter(poly), R = rimAt(poly, c, a) * (k || 1.06); return localToWorld(c[0] + Math.cos(a) * R, c[1] + Math.sin(a) * R, FRONT()); }

// ---------- zone guide: three arcs traced along the window's own boundary + labels
function makeGuide() { if (tg.guide) fxScene.remove(tg.guide); const g = new THREE.Group(); g.userData.arcs = {};
  const span = { far: [40, 140], mid: [140, 220], near: [220, 320], mid2: [-40, 40] };
  for (const [k, [a0, a1]] of Object.entries(span)) { const z = k === 'mid2' ? 'mid' : k, pts = []; for (let i = 0; i <= 40; i++) pts.push(rimPoint((a0 + (a1 - a0) * i / 40) * Math.PI / 180, 1.1));
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: C(ZONE[z].col), transparent: true, opacity: .4, dashSize: .012, gapSize: .008, depthTest: false })); line.computeLineDistances(); line.renderOrder = 10; g.add(line); (g.userData.arcs[z] = g.userData.arcs[z] || []).push(line); }
  for (const [z, deg] of [['far', 90], ['mid', 0], ['near', 270]]) { const cvs = document.createElement('canvas'); cvs.width = 256; cvs.height = 64; const x = cvs.getContext('2d'); x.font = '500 30px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = ZONE[z].col; x.fillText(ZONE[z].zh, 128, 32);
    const t = new THREE.CanvasTexture(cvs); t.encoding = THREE.sRGBEncoding; const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false, opacity: .5 })); s.scale.set(.16, .04, 1); s.position.copy(rimPoint(deg * Math.PI / 180, 1.3)); s.renderOrder = 11; g.add(s); g.userData.arcs[z].push(s); }
  fxScene.add(g); tg.guide = g; }
function hiGuide(zone) { if (!tg.guide) return; for (const [z, list] of Object.entries(tg.guide.userData.arcs)) list.forEach(o => o.material.opacity = z === zone ? 1 : .32); }

// ---------- layer re-toning
function gradeColor(c0, mood) { const M = MOOD[mood], l = c0.r * .299 + c0.g * .587 + c0.b * .114; const g = new THREE.Color(l, l, l).lerp(c0, M.sat); g.multiply(C(M.tint)).multiplyScalar(M.k); return g.lerp(C(M.lift), M.la); }
function layerMats(zone) { const set = new Set(); gar.L[zone].traverse(o => { if (!o.material) return; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => set.add(m)); }); return [...set]; }
function retone(zone, mood) { const tracks = [];
  layerMats(zone).forEach(m => { if (m.isShaderMaterial) { const u = m.uniforms && m.uniforms.c; if (!u || !u.value || !u.value.isColor) return; m.userData.c0 = m.userData.c0 || u.value.clone(); tracks.push({ col: u.value, from: u.value.clone(), to: mood ? C(SCENE6[mood].fog[0]) : m.userData.c0.clone() }); return; }
    if (m.color) { m.userData.c0 = m.userData.c0 || m.color.clone(); tracks.push({ col: m.color, from: m.color.clone(), to: mood ? gradeColor(m.userData.c0, mood) : m.userData.c0.clone() }); }
    if (m.emissive) { m.userData.e0 = m.userData.e0 || m.emissive.clone(); tracks.push({ col: m.emissive, from: m.emissive.clone(), to: mood ? m.userData.e0.clone().lerp(C(MOOD[mood].lift), .5) : m.userData.e0.clone() }); } });
  if (zone === 'far') { const S = mood ? SCENE6[mood] : null, u = gar.sky && gar.sky.material.uniforms;
    if (u) [['cT', 0], ['cM', 1], ['cB', 2], ['gC', 4]].forEach(([n, i]) => { u[n].userData = u[n].userData || {}; u[n].userData.c0 = u[n].userData.c0 || u[n].value.clone(); let to = S ? C(S.sky[i] || '#000000') : u[n].userData.c0.clone(); if (mood === 'arch' && n !== 'gC') { const l = to.r * .3 + to.g * .59 + to.b * .11; to.lerp(new THREE.Color(l, l, l), .45); } tracks.push({ col: u[n].value, from: u[n].value.clone(), to }); });
    gar.fogC0 = gar.fogC0 || C(gar.fog[0]); tracks.push({ col: gScene.fog.color, from: gScene.fog.color.clone(), to: S ? C(S.fog[0]) : gar.fogC0.clone(), fog: true }); }
  tg.anims = tg.anims.filter(a => a.zone !== zone); tg.anims.push({ zone, t: 0, tracks }); }
function restoreAllNow() { ['far', 'mid', 'near'].forEach(z => { layerMats(z).forEach(m => { if (m.isShaderMaterial) { if (m.userData.c0) m.uniforms.c.value.copy(m.userData.c0); } else { if (m.userData.c0) m.color.copy(m.userData.c0); if (m.userData.e0) m.emissive.copy(m.userData.e0); } }); });
  const u = gar.sky && gar.sky.material.uniforms; if (u) ['cT', 'cM', 'cB', 'gC'].forEach(n => { if (u[n].userData && u[n].userData.c0) u[n].value.copy(u[n].userData.c0); }); if (gar.fogC0) gScene.fog.color.copy(gar.fogC0); tg.anims = []; }

// ---------- toast
const toast = document.createElement('div'); toast.id = 'tgToast'; toast.setAttribute('aria-live', 'polite');
toast.style.cssText = 'position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(20,22,24,.62);color:#F3EBDD;font:500 13px/1.4 system-ui,sans-serif;letter-spacing:.04em;pointer-events:none;opacity:0;transition:opacity .4s;z-index:5;backdrop-filter:blur(6px)';
host.parentElement.appendChild(toast); let toastT = 0; function say(s) { toast.textContent = s; toast.style.opacity = 1; toastT = st.t + 2.8; }

// ---------- stick / unstick
function stick(p, zone, a) { const prev = tg.stuck[zone]; if (prev && prev !== p) { prev.zone = null; } if (p.zone) tg.stuck[p.zone] = null;
  if (!p.d.mood) { ['far', 'mid', 'near'].forEach(z => { const q = tg.stuck[z]; if (q) q.zone = null; tg.stuck[z] = null; retone(z, null); }); p.zone = null; say('平行四边形 · 三层还原为原本的' + SCN[DEFS[curKey].scene].zh); return; }
  p.zone = zone; p.a = a; tg.stuck[zone] = p; retone(zone, p.d.mood); say(`${p.d.zh} · ${MOOD[p.d.mood].zh} → ${ZONE[zone].zh}`); }
function unstick(p) { if (!p.zone) return; const z = p.zone; tg.stuck[z] = null; p.zone = null; retone(z, null); say(`取下 · ${ZONE[z].zh}恢复${SCN[DEFS[curKey].scene].zh}`); }

// ---------- per-frame
function homeWorld(i) { setNdcXY(HOME[i][0], HOME[i][1]); const out = new THREE.Vector3(); ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1), -(winPlaneZ() + .05)), out); return out; }
function setNdcXY(x, y) { ndc.set(x, y); ray.setFromCamera(ndc, camera); }
function tgUpdate(dt) { const show = st.k > .6 && cur && gar;
  tg.anims.forEach(a => { a.t = Math.min(1, a.t + dt / 1.4); const k = ease(a.t); a.tracks.forEach(tr => tr.col.copy(tr.from).lerp(tr.to, k)); }); tg.anims = tg.anims.filter(a => a.t < 1);
  if (toastT && st.t > toastT) { toast.style.opacity = 0; toastT = 0; }
  tg.pieces.forEach(p => { p.g.visible = !!show; if (!show) return; p.spin += dt * .4;
    let target, q = new THREE.Quaternion();
    if (tg.drag && tg.drag.p === p) { target = tg.drag.pos; q.copy(camera.quaternion); }
    else if (p.zone) { target = rimPoint(p.a, 1.08); cur.getWorldQuaternion(q); q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), p.a - Math.PI / 2)); }
    else { target = homeWorld(p.i); target.y += Math.sin(st.t * 1.2 + p.i) * .008; q.copy(camera.quaternion).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.sin(p.spin) * .35, Math.cos(p.spin * .8) * .45, p.spin * .3))); }
    p.g.position.lerp(target, Math.min(1, dt * (tg.drag && tg.drag.p === p ? 30 : 7))); p.g.quaternion.slerp(q, Math.min(1, dt * 8));
    const pulse = .28 + .1 * Math.sin(st.t * 2 + p.i); p.halo.material.opacity = p.zone ? pulse + .12 : pulse; p.body.material.opacity = p.zone ? .62 : .48; });
  if (tg.guide) tg.guide.visible = !!(show && tg.drag); }

// ---------- input: grab pieces in the air (capture, before the window grab)
function pickPiece(e) { setNdc(e); const hits = ray.intersectObjects(tg.pieces.filter(p => p.g.visible).map(p => p.body), false); return hits.length ? tg.pieces[hits[0].object.userData.piece] : null; }
function beginDrag(p, e) { st.hold = true; st.lastHold = st.lastUser = st.t; if (st.mode !== 'window') { setMode('window'); applyMode(); }
  unstick(p); makeGuide(); tg.drag = { p, pos: p.g.visible ? p.g.position.clone() : planePoint(e, winPlaneZ() + .05) }; st.drag = { kind: 'piece' }; }
function moveDrag(e) { if (!tg.drag) return; st.lastHold = st.lastUser = st.t; const wp = planePoint(e, winPlaneZ() + .05); tg.drag.pos.copy(wp); const h = frameHit(wp); tg.drag.hit = h.ok ? h : null; hiGuide(h.ok ? h.zone : null); }
function endDrag(fallbackFar) { if (!tg.drag) return; const { p, hit } = tg.drag; tg.drag = null; st.drag = null; st.lastHold = st.t;
  if (hit) stick(p, hit.zone, hit.a); else if (fallbackFar) stick(p, 'far', Math.PI / 2); }
cv.addEventListener('pointerdown', e => { const p = pickPiece(e); if (!p) return; e.stopImmediatePropagation(); cv.setPointerCapture(e.pointerId); beginDrag(p, e); }, { capture: true });
cv.addEventListener('pointermove', e => { if (!tg.drag) return; e.stopImmediatePropagation(); if (tg.drag.fromTray) tg.drag.moved = true; moveDrag(e); }, { capture: true });
addEventListener('pointermove', e => { if (tg.drag && e.target !== cv) moveDrag(e); });
addEventListener('pointerup', () => { if (tg.drag) endDrag(tg.drag.fromTray && !tg.drag.moved); });

// ---------- tray (take a piece from the interface)
const tray = document.createElement('div'); tray.id = 'tangram'; tray.setAttribute('role', 'group'); tray.setAttribute('aria-label', '七巧板');
tray.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 2px';
tray.innerHTML = '<span style="font:500 12.5px/1.3 system-ui,sans-serif;color:#d8d3c7;margin-right:6px">七巧板 <small style="opacity:.7">拖到窗框：上缘远景 · 两侧中景 · 下缘近景</small></span>';
PIECES.forEach((d, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tgp'; b.title = d.mood ? `${d.zh} · ${MOOD[d.mood].zh}` : `${d.zh} · 还原`;
  b.style.cssText = 'width:44px;height:40px;border-radius:10px;border:1px solid rgba(216,211,199,.25);background:rgba(255,255,255,.04);cursor:grab;padding:0;touch-action:none';
  const cvs = document.createElement('canvas'); cvs.width = cvs.height = 64; cvs.style.cssText = 'width:30px;height:30px;pointer-events:none'; const x = cvs.getContext('2d'), col = d.mood ? MOOD[d.mood].col : '#F2E6C8';
  x.translate(32, 34); x.scale(56, -56); x.beginPath(); SHAPES[d.shape].forEach((p, k) => k ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.globalAlpha = .55; x.fillStyle = col; x.fill(); x.globalAlpha = 1; x.lineWidth = 3 / 56; x.strokeStyle = col; x.stroke();
  b.appendChild(cvs);
  b.addEventListener('pointerdown', e => { e.preventDefault(); const p = tg.pieces[i]; beginDrag(p, e); tg.drag.fromTray = true; tg.drag.pos.copy(homeWorld(i)); });
  b.addEventListener('pointermove', e => { if (tg.drag && tg.drag.fromTray) tg.drag.moved = true; });
  tray.appendChild(b); });
chips.parentElement.insertBefore(tray, chips.nextSibling);

// ---------- hooks: run every tick; clear moods when the window/scene changes
const _tick0 = tick; tick = dt => { _tick0(dt); if (cur && gar) tgUpdate(dt); };
const _select0 = select; select = (k, s) => { if (gar) restoreAllNow(); tg.pieces.forEach(p => p.zone = null); tg.stuck = { far: null, mid: null, near: null }; _select0(k, s); };
Object.assign(window.__garden, { select, tg, rimScreen: a => { const v = rimPoint(a, 1.08); v.project(camera); const r = cv.getBoundingClientRect(); return [r.left + (v.x * .5 + .5) * r.width, r.top + (-v.y * .5 + .5) * r.height]; }, stickTest: (i, zone) => { const a = { far: Math.PI / 2, mid: 0, near: -Math.PI / 2 }[zone]; st.hold = true; setMode('window'); applyMode(); stick(tg.pieces[i], zone, a); } });

})();

</script>
